<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Container styling with blue top and bottom borders */
.logo-slider {
  background-color: #ffffff;
  border-top: 18px solid #00008b;
  border-bottom: 18px solid #00008b;
  height: 90px;
  overflow: hidden;
  position: relative;
  width: 100%;
}

/* Flex track that shifts seamlessly leftward */
.logo-slide-track {
  display: flex;
  align-items: center;
  width: calc(250px * 20); /* 250px per logo width * total logos (original + duplicate) */
  animation: scroll 25s linear infinite;
}

.logo-slide-track:hover {
  animation-play-state: paused; /* Optional: pauses marquee on hover */
}

/* Individual logo container */
.logo {
  width: 250px;
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 30px;
  box-sizing: border-box;
}

.logo img {
  max-width: 100%;
  max-height: 45px;
  object-fit: contain;
}

/* Keyframes for seamless looping */
@keyframes scroll {
  0% {
    transform: translateX(0);
  }
  100% {
    transform: translateX(calc(-250px * 10)); /* Width of original 10 logos */
  }
}
    </style>
</head>
<body>
    



<div class="logo-slider">
  <div class="logo-slide-track">
    <!-- First Set of Logos -->
    <div class="logo"><img src="google-logo.png" alt="Google" /></div>
    <div class="logo"><img src="meta-logo.png" alt="Meta" /></div>
    <div class="logo"><img src="expedia-logo.png" alt="Expedia" /></div>
    <div class="logo"><img src="lenskart-logo.png" alt="Lenskart" /></div>
    <div class="logo"><img src="ola-logo.png" alt="Ola Electric" /></div>
    <div class="logo"><img src="walmart-logo.png" alt="Walmart" /></div>
    <div class="logo"><img src="duolingo-logo.png" alt="Duolingo" /></div>
    <div class="logo"><img src="airbnb-logo.png" alt="Airbnb" /></div>
    <div class="logo"><img src="adobe-logo.png" alt="Adobe" /></div>
    <div class="logo"><img src="mamaearth-logo.png" alt="Mamaearth" /></div>

    <!-- Duplicate Set (Required for Seamless Infinite Loop) -->
    <div class="logo"><img src="google-logo.png" alt="Google" /></div>
    <div class="logo"><img src="meta-logo.png" alt="Meta" /></div>
    <div class="logo"><img src="expedia-logo.png" alt="Expedia" /></div>
    <div class="logo"><img src="lenskart-logo.png" alt="Lenskart" /></div>
    <div class="logo"><img src="ola-logo.png" alt="Ola Electric" /></div>
    <div class="logo"><img src="walmart-logo.png" alt="Walmart" /></div>
    <div class="logo"><img src="duolingo-logo.png" alt="Duolingo" /></div>
    <div class="logo"><img src="airbnb-logo.png" alt="Airbnb" /></div>
    <div class="logo"><img src="adobe-logo.png" alt="Adobe" /></div>
    <div class="logo"><img src="mamaearth-logo.png" alt="Mamaearth" /></div>
  </div>
</div>

</body>
</html>
